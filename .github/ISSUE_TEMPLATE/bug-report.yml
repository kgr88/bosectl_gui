name: Bug Report
description: Report a bug in the library or desktop app
labels: ["bug"]
body:
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "QC Ultra 2 / QC35 / etc."
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Python library (pybmap)
        - Windows desktop app
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to QC35
        2. Set noise cancellation to high
        3. ...

  - type: input
    id: version
    attributes:
      label: Version
      description: pybmap version or desktop app version
      placeholder: "0.3.0"
