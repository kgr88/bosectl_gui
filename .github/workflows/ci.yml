name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs supersede each other; push and manual runs each get their own group.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check
      - run: python -m ruff format --check
      - run: python -m pytest
      - name: Validate Dependabot config
        working-directory: .
        run: check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml

  renderer:
    name: Renderer tests and build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm test
      - run: corepack pnpm build

  rust:
    name: Rust tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test
        working-directory: desktop/src-tauri

  changes:
    name: Detect packaging changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            packaging:
              - .github/workflows/ci.yml
              - packaging/windows/**
              - python/**
              - desktop/src-tauri/**
              - desktop/package.json
              - desktop/pnpm-lock.yaml
              - desktop/pnpm-workspace.yaml

  package:
    name: Windows installer
    needs: [changes, python, renderer, rust]
    if: github.event_name != 'pull_request' || needs.changes.outputs.packaging == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - run: python -m pip install pyinstaller
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Build the frozen backend and NSIS installer
        shell: pwsh
        run: ./packaging/windows/build-release.ps1 -PythonExecutable python -SkipTests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bosectl-installer
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*
          if-no-files-found: error
