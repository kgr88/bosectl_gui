[project]
name = "pybmap"
version = "0.3.0"
description = "Control Bluetooth audio devices over the BMAP protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Aaron Bockelie"},
]
keywords = ["bluetooth", "bmap", "headphones", "audio", "noise-cancellation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kgr88/bosectl_gui"
Repository = "https://github.com/kgr88/bosectl_gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a paired Bluetooth device",
]
