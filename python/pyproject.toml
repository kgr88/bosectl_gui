[project]
name = "pybmap"
version = "0.3.0"
description = "Control Bluetooth audio devices over the BMAP protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "Aaron Bockelie"},
]
keywords = ["bluetooth", "bmap", "headphones", "audio", "noise-cancellation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kgr88/bosectl_gui"
Repository = "https://github.com/kgr88/bosectl_gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a paired Bluetooth device",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# printf-style formatting is used throughout. Converting it is a separate change.
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export the public API.
"pybmap/__init__.py" = ["F401"]
